<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drip Wave | Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f1a; }
        .glass { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .gradient-text { background: linear-gradient(90deg, #6366f1 0%, #a855f7 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .status-dot { height: 8px; width: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
        .animate-pulse-slow { animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body class="text-slate-200 min-h-screen">
    <!-- Sidebar / Nav -->
    <nav class="fixed top-0 left-0 right-0 h-20 glass z-50 px-8 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 p-2 rounded-lg">
                <i class="fas fa-droplet text-white"></i>
            </div>
            <span class="text-xl font-bold text-white tracking-tight">Drip<span class="text-indigo-500">Wave</span></span>
        </div>
        
        <div class="flex items-center space-x-6 text-sm font-medium">
            <div class="flex items-center text-slate-400">
                <span class="status-dot bg-green-500 animate-pulse-slow"></span>
                Automation Engine: Active
            </div>
            <div class="h-8 w-[1px] bg-slate-800"></div>
            <div class="flex items-center space-x-2">
                <img src="https://github.com/zikyfranky.png" class="w-8 h-8 rounded-full border border-indigo-500/30">
                <span class="text-white">zikyfranky</span>
            </div>
        </div>
    </nav>

    
    <main class="pt-32 pb-20 px-8 max-w-7xl mx-auto">
        <!-- Dashboard Metrics -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10">
            <div class="glass p-6 rounded-3xl"><p class="text-slate-400 text-xs uppercase mb-1">Found</p><h2 id="total-apps" class="text-4xl font-bold text-white">0</h2></div>
            <div class="glass p-6 rounded-3xl"><p class="text-slate-400 text-xs uppercase mb-1">Assigned</p><h2 id="assigned" class="text-4xl font-bold text-indigo-400">0</h2></div>
            <div class="glass p-6 rounded-3xl"><p class="text-slate-400 text-xs uppercase mb-1">Earned</p><h2 id="earned-count" class="text-4xl font-bold text-green-400">0</h2></div>
            <div class="glass p-6 rounded-3xl"><p class="text-slate-400 text-xs uppercase mb-1">Points</p><h2 id="total-points" class="text-4xl font-bold text-amber-500">0</h2></div>
        </div>

        <!-- 1. ACTIVE PIPELINE SECTION -->
        <div class="glass rounded-3xl overflow-hidden mb-10 border border-indigo-500/30">
            <div class="bg-indigo-500/10 p-6 flex justify-between items-center">
                <h3 class="text-lg font-bold text-indigo-300"><i class="fas fa-microchip mr-3"></i> Confirmed Work (Active Pipeline)</h3>
            </div>
            <table class="w-full text-left">
                <thead class="bg-slate-900/40 text-[10px] uppercase text-slate-500 font-bold">
                    <tr class="border-b border-slate-800">
                        <th class="p-6">Project / Issue</th>
                        <th class="p-6">Status</th>
                        <th class="p-6 text-right">GitHub</th>
                    </tr>
                </thead>
                <tbody id="pipeline-list">
                    <tr><td colspan="3" class="p-12 text-center text-slate-500">Scanning for assignments...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- 2. SNIPER FEED SECTION -->
        <div class="glass rounded-3xl overflow-hidden mb-10">
            <div class="bg-white/5 p-6 flex justify-between items-center">
                <h3 class="text-lg font-bold text-white"><i class="fas fa-crosshairs mr-3"></i> Potential Jobs (Sniper Feed)</h3>
                <button onclick="triggerScan()" class="text-xs bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-full font-bold transition-all">SCAN NOW</button>
            </div>
            <table class="w-full text-left">
                <thead class="bg-slate-900/40 text-[10px] uppercase text-slate-500 font-bold">
                    <tr class="border-b border-slate-800">
                        <th class="p-6">Target Details</th>
                        <th class="p-6">Pitch Preview</th>
                        <th class="p-6 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="apps-list">
                    <tr><td colspan="3" class="p-12 text-center text-slate-500 text-xs italic">Loading scanner data...</td></tr>
                </tbody>
            </table>
        </div>
    </main>


    
    
    
    <script>
        async function triggerScan() {
            const btn = event.target;
            btn.innerText = 'Scanning...';
            btn.disabled = true;
            try {
                await fetch('/api/sniper/scan', { method: 'POST' });
                alert('Scan initiated. Data will update shortly.');
                refreshData();
            } catch (e) { alert('Scan failed'); }
            btn.innerText = 'SCAN NOW';
            btn.disabled = false;
        }

        async function snipe(id) {
            try {
                const res = await fetch('/api/snipe/' + id, { method: 'POST' });
                const data = await res.json();
                alert('Sniper Result: ' + data.status);
                refreshData();
            } catch (e) { alert('Snipe engine error'); }
        }

        async function refreshData() {
            try {
                // Analytics
                const stats = await (await fetch('/api/analytics')).json();
                document.getElementById('total-apps').innerText = stats.total_apps || 0;
                document.getElementById('assigned').innerText = stats.assigned || 0;
                document.getElementById('earned-count').innerText = stats.earned || 0;
                document.getElementById('total-points').innerText = stats.total_points || 0;

                // Issues
                const apps = await (await fetch('/api/applications')).json();
                
                // --- 1. SNIPER FEED (Status PENDING only) ---
                const sniperList = document.getElementById('apps-list');
                const pendingIssues = apps.filter(a => a.status.toUpperCase() === 'PENDING');
                
                if (pendingIssues.length === 0) {
                    sniperList.innerHTML = '<tr><td colspan="3" class="p-12 text-center text-slate-500 text-sm">No new potential jobs. Click Scan Now.</td></tr>';
                } else {
                    sniperList.innerHTML = pendingIssues.map(app => `
                        
                        <tr class="group border-t border-slate-800 hover:bg-white/5 transition-colors">
                            <td class="px-8 py-6">
                                <div class="flex flex-col">
                                    <span class="text-sm font-bold text-white">${app.title}</span>
                                    <span class="text-[10px] text-slate-500 font-mono">${app.github_url.split('/').slice(-2).join('/')}</span>
                                </div>
                            </td>
                            <td class="px-6 py-6 text-[11px] text-slate-400 italic font-medium w-96 leading-relaxed">
                                "${app.pitch ? app.pitch : 'Pitch drafting...'}"
                            </td>
                            <td class="px-6 py-6 text-right flex items-center justify-end space-x-3">
                                <button onclick="snipe(${app.id})" class="text-[10px] bg-amber-600 hover:bg-amber-500 text-white px-4 py-2 rounded-lg font-black tracking-widest shadow-xl">SNIPE</button>
                                <a href="https://www.drips.network/wave/stellar/issue/${app.github_url.split('/').pop()}" target="_blank" class="h-9 w-9 glass flex items-center justify-center rounded-xl text-indigo-400 hover:bg-indigo-600 hover:text-white transition-all text-xs" title="View on Drips">
                                    <i class="fas fa-droplet"></i>
                                </a>
                                <a href="${app.github_url}" target="_blank" class="h-9 w-9 glass flex items-center justify-center rounded-xl text-indigo-400 hover:bg-indigo-600 hover:text-white transition-all text-xs" title="View on GitHub">
                                    <i class="fab fa-github"></i>
                                </a>
                            </td>
                        </tr>

                    `).join('');
                }

                // --- 2. PIPELINE (Status ASSIGNED / WORKING only) ---
                const pipelineList = document.getElementById('pipeline-list');
                const workIssues = apps.filter(a => ['ASSIGNED', 'WORKING', 'ASSIGNED_MIMS'].includes(a.status.toUpperCase()));
                
                if (workIssues.length === 0) {
                   pipelineList.innerHTML = '<tr><td colspan="3" class="p-12 text-center text-slate-600 text-xs italic">Waiting for your first assignment. Apply to some drips!</td></tr>';
                } else {
                   pipelineList.innerHTML = workIssues.map(app => `
                        <tr class="group border-t border-indigo-900/30 bg-indigo-500/5 transition-colors">
                            <td class="px-8 py-6">
                                <div class="text-sm font-bold text-indigo-300">#${app.id} | ${app.title}</div>
                            </td>
                            <td class="px-6 py-6">
                                <span class="px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest bg-indigo-900/50 text-indigo-300 border border-indigo-500/30">${app.status}</span>
                            </td>
                            <td class="px-6 py-6 text-right">
                                <a href="${app.github_url}" target="_blank" class="text-indigo-400 hover:text-white text-lg"><i class="fas fa-external-link-alt"></i></a>
                            </td>
                        </tr>
                   `).join('');
                }
            } catch (e) { console.error('Dashboard Sync Error', e); }
        }

        refreshData();
        setInterval(refreshData, 30000);
    </script>



</body>
</html>
